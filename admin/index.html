<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | BGameWorld</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--ink:#14161A;--ink-2:#3F444D;--ink-3:#6B717C;--paper:#F6F7F9;--card:#FFFFFF;--rule:#E3E6EB;--rule-2:#EEF0F3;
  --accent:#2860D8;--accent-soft:#E7EEFC;--good:#1E7D4A;--good-soft:#E3F3EA;--warn:#8A6100;--warn-soft:#FBF1D9;--bad:#B3261E;
  --sans:"Libre Franklin","Inter","Helvetica Neue",Arial,sans-serif;--radius:12px}
@media (prefers-color-scheme:dark){:root{--ink:#EEF0F3;--ink-2:#C6CAD2;--ink-3:#8F95A0;--paper:#111317;--card:#1A1D23;--rule:#2C3039;--rule-2:#23272F;
  --accent:#7FA6FF;--accent-soft:#1E2B47;--good:#7BD3A0;--good-soft:#173326;--warn:#F2C76B;--warn-soft:#3A2F14;--bad:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:1120px;margin:0 auto;padding:0 20px 64px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-size:15px;margin:0}
.muted{color:var(--ink-3);font-size:12.5px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:7px 11px}
button{cursor:pointer;font-weight:600}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* header */
.head{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0 14px;border-bottom:1px solid var(--rule);margin-bottom:20px}
.head .brand{display:flex;align-items:baseline;gap:10px}
.head .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* key numbers */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:16px 18px}
.kpi .label{color:var(--ink-3);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .value{font-size:30px;font-weight:700;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sub{color:var(--ink-3);font-size:12.5px;margin-top:2px}

/* cards */
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);margin-top:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--rule-2)}
.card-body{padding:14px 18px}
svg.chart{width:100%;height:120px;display:block}
.axis{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11.5px;margin-top:4px}

/* tabs */
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--rule-2);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:12px 12px 10px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--rule-2);color:var(--ink-3);font-size:11.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--rule-2)}
.filters input[type=search]{min-width:200px;flex:1}
.filters label{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}

/* tables */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 18px;border-bottom:1px solid var(--rule-2);vertical-align:middle;white-space:nowrap}
th{color:var(--ink-3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:var(--card);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--rule-2)}
.who b{font-weight:600}
.id{color:var(--ink-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.badge.reg{background:var(--good-soft);color:var(--good)}
.badge.guest{background:var(--rule-2);color:var(--ink-3)}
.badge.bot{background:var(--warn-soft);color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--accent-soft);min-width:60px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.empty{padding:28px 18px;color:var(--ink-3);text-align:center}
.foot{margin-top:18px;color:var(--ink-3);font-size:12px;line-height:1.6}
.foot a{color:inherit}

#login{max-width:340px;margin:14vh auto;display:grid;gap:10px}
#login input{width:100%}
.err{color:var(--bad);font-size:13.5px;min-height:20px}
</style>
</head>
<body>
<main>
  <section id="login" hidden>
    <h1>BGameWorld admin</h1>
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="go" class="primary">Sign in</button>
    <button id="signup" type="button">Create account</button>
    <div id="lerr" class="err" role="alert"></div>
  </section>

  <section id="app" hidden>
    <div class="head">
      <div class="brand"><h1>BGameWorld admin</h1><span class="muted" id="stamp"></span></div>
      <div class="actions">
        <select id="range" aria-label="Chart period">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
        <button id="refresh">Refresh</button>
        <button id="out">Sign out</button>
      </div>
    </div>
    <div id="aerr" class="err" role="alert"></div>
    <div id="body"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var SB_URL="https://hkcvtoozpeybwehqtiif.supabase.co";
  var SB_KEY="sb_publishable_CGTFNipWN_1IeG28m4upSg_n2HSsGai";
  var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:"bgw-admin-auth"}});
  var $=function(id){return document.getElementById(id)};
  var data=null, tab="activity", filters={game:"",q:"",bots:false};
  try{tab=sessionStorage.getItem("bgw-admin-tab")||tab}catch(e){}

  /* ---------- formatting ---------- */
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function fmt(n){return Number(n||0).toLocaleString()}
  function when(t){if(!t)return "–";var d=new Date(t),now=new Date(),s=(now-d)/1000;
    if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+" min ago";
    if(d.toDateString()===now.toDateString())return "Today "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    return d.toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
  function flag(cc){if(!cc||cc.length!==2)return "";return String.fromCodePoint.apply(null,cc.toUpperCase().split("").map(function(c){return 127397+c.charCodeAt(0)}))}
  var country=function(cc){return cc};try{var dn=new Intl.DisplayNames(["en"],{type:"region"});country=function(cc){try{return dn.of(cc)}catch(e){return cc}}}catch(e){}
  function place(r){if(!r||!r.country)return '<span class="muted">Unknown</span>';
    var local=[r.city,r.region].filter(Boolean).join(", ");
    return flag(r.country)+" "+esc(local?local+", "+country(r.country):country(r.country))}
  function who(r){return '<span class="who">'+(r.name?'<b>'+esc(r.name)+'</b> ':'')+'<span class="id">'+esc(r.player)+'</span></span>'}
  function kind(r){return r.likely_bot?'<span class="badge bot" title="From a data centre: probably a bot or crawler">Bot?</span>':
    (r.registered?'<span class="badge reg">Registered</span>':'<span class="badge guest">Guest</span>')}
  var gameName=function(slug){return slug};

  /* ---------- pieces ---------- */
  function kpi(label,value,sub){return '<div class="kpi"><div class="label">'+label+'</div><div class="value">'+fmt(value)+'</div><div class="sub">'+(sub||"&nbsp;")+'</div></div>'}

  function chart(series){
    var v=series.map(function(p){return p.plays||0}),max=Math.max.apply(null,v.concat([1])),w=1000,h=120,n=v.length,bw=w/n;
    var bars=v.map(function(x,i){var bh=Math.max(x?3:0,x/max*(h-8));
      return '<rect x="'+(i*bw+bw*.15)+'" y="'+(h-bh)+'" width="'+Math.max(bw*.7,1)+'" height="'+bh+'" rx="2" fill="var(--accent)"><title>'+esc(series[i].day)+': '+x+' games, '+(series[i].active_players||0)+' players</title></rect>'}).join("");
    return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Games played per day">'+bars+'</svg>'+
      '<div class="axis"><span>'+esc(series[0]&&series[0].day)+'</span><span>Most in a day: '+fmt(max)+'</span><span>'+esc(series[n-1]&&series[n-1].day)+'</span></div>'}

  function table(head,rows,empty){
    if(!rows.length)return '<div class="empty">'+empty+'</div>';
    return '<div class="scroll"><table><thead><tr>'+head.map(function(h){return '<th'+(h.num?' class="num"':'')+'>'+h.t+'</th>'}).join("")+'</tr></thead><tbody>'+rows.join("")+'</tbody></table></div>'}
  function td(v,num){return '<td'+(num?' class="num"':'')+'>'+v+'</td>'}

  /* ---------- tabs ---------- */
  function activityTab(){
    var games=data.games.filter(function(g){return g.plays_total>0});
    var f='<div class="filters"><input type="search" id="fq" placeholder="Search player, name or place" value="'+esc(filters.q)+'">'+
      '<select id="fgame" aria-label="Game"><option value="">All games</option>'+games.map(function(g){return '<option value="'+esc(g.slug)+'"'+(filters.game===g.slug?" selected":"")+'>'+esc(g.name)+'</option>'}).join("")+'</select>'+
      '<label><input type="checkbox" id="fbots"'+(filters.bots?" checked":"")+'> Show bots</label></div>';
    var q=filters.q.toLowerCase();
    var rows=data.recent_plays.filter(function(r){
      if(!filters.bots&&r.likely_bot)return false;
      if(filters.game&&r.game!==filters.game)return false;
      if(q&&[r.player,r.name,r.city,r.region,r.country&&country(r.country)].join(" ").toLowerCase().indexOf(q)<0)return false;
      return true});
    return f+table([{t:"When"},{t:"Player"},{t:"Type"},{t:"Location"},{t:"Game"}],
      rows.map(function(r){return '<tr>'+td(esc(when(r.at)))+td(who(r))+td(kind(r))+td(place(r))+td(esc(gameName(r.game)))+'</tr>'}),
      "No plays match these filters.")+
      '<div class="card-body muted">Showing '+fmt(rows.length)+' of the latest '+fmt(data.recent_plays.length)+' plays.</div>'}

  function playersTab(){
    var L=data.locations||{players:[]};
    var rows=L.players.filter(function(p){return filters.bots||!p.likely_bot});
    return table([{t:"Player"},{t:"Type"},{t:"Location"},{t:"Games played"},{t:"Plays",num:1},{t:"Last played"}],
      rows.map(function(p){return '<tr>'+td(who(p))+td(kind(p))+td(place(p))+td(esc((p.games||"").split(", ").map(gameName).join(", ")))+td(fmt(p.plays),1)+td(esc(when(p.last_play)))+'</tr>'}),
      "No players yet.")}

  function gamesTab(){
    var max=Math.max.apply(null,data.games.map(function(g){return g.plays_7d}).concat([1]));
    return table([{t:"Game"},{t:"Today",num:1},{t:"Last 7 days",num:1},{t:""},{t:"Players, 7 days",num:1},{t:"All time",num:1},{t:"Last played"}],
      data.games.map(function(g){return '<tr>'+td('<b>'+esc(g.name)+'</b>')+td(fmt(g.plays_today),1)+td(fmt(g.plays_7d),1)+
        td('<div class="bar"><i style="width:'+Math.round(g.plays_7d/max*100)+'%"></i></div>')+td(fmt(g.players_7d),1)+td(fmt(g.plays_total),1)+td(esc(when(g.last_play)))+'</tr>'}),
      "No games.")}

  function countriesTab(){
    var C=(data.locations&&data.locations.countries)||[];
    var max=Math.max.apply(null,C.map(function(c){return c.players_who_played}).concat([1]));
    var rows=C.filter(function(c){return c.players_who_played>0}).sort(function(a,b){return b.players_who_played-a.players_who_played||b.plays-a.plays});
    return table([{t:"Country"},{t:"Players who played",num:1},{t:""},{t:"Games played",num:1}],
      rows.map(function(c){return '<tr>'+td(flag(c.country)+" "+esc(country(c.country)))+td(fmt(c.players_who_played),1)+
        td('<div class="bar"><i style="width:'+Math.round(c.players_who_played/max*100)+'%"></i></div>')+td(fmt(c.plays),1)+'</tr>'}),
      "No players with a location yet.")+'<div class="card-body muted">Only people who actually played are counted. Bots are left out.</div>'}

  function registeredTab(){
    return table([{t:"Name"},{t:"Email"},{t:"Location"},{t:"Joined"},{t:"Last sign-in"}],
      data.registered_users.map(function(u){return '<tr>'+td('<b>'+esc(u.name||"–")+'</b>')+td(esc(u.email))+td(place(u))+td(esc(when(u.created_at)))+td(esc(when(u.last_sign_in_at)))+'</tr>'}),
      "No registered players yet.")}

  var TABS=[["activity","Activity",function(){return data.recent_plays.filter(function(r){return !r.likely_bot}).length}],
            ["players","Players",function(){return ((data.locations&&data.locations.players)||[]).filter(function(p){return !p.likely_bot}).length}],
            ["games","Games",function(){return data.games.length}],
            ["countries","Countries",function(){return ((data.locations&&data.locations.countries)||[]).filter(function(c){return c.players_who_played>0}).length}],
            ["registered","Registered",function(){return data.totals.registered_users}]];
  var VIEWS={activity:activityTab,players:playersTab,games:gamesTab,countries:countriesTab,registered:registeredTab};

  function renderTab(){
    $("tabs").innerHTML=TABS.map(function(t){return '<button class="tab" role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'<span class="count">'+fmt(t[2]())+'</span></button>'}).join("");
    $("panel").innerHTML=VIEWS[tab]();
    var fq=$("fq"),fg=$("fgame"),fb=$("fbots");
    if(fq)fq.oninput=function(){filters.q=fq.value;var pos=fq.selectionStart;renderTab();var n=$("fq");n.focus();n.setSelectionRange(pos,pos)};
    if(fg)fg.onchange=function(){filters.game=fg.value;renderTab()};
    if(fb)fb.onchange=function(){filters.bots=fb.checked;renderTab()};
  }

  function render(d){
    data=d;
    var names={};d.games.forEach(function(g){names[g.slug]=g.name});gameName=function(s){return names[s]||s};
    var t=d.totals,h="";
    h+='<div class="kpis">'+
      kpi("Active players today",t.active_players_today,fmt(t.active_players_7d)+" in the last 7 days")+
      kpi("Games played today",t.plays_today,fmt(t.plays_7d)+" in the last 7 days")+
      kpi("Active players, 7 days",t.active_players_7d,"People who finished at least one game")+
      kpi("Registered players",t.registered_users,"Signed up with an email")+'</div>';
    h+='<div class="card"><div class="card-head"><h2>Games played per day</h2><span class="muted">Last '+d.range_days+' days</span></div><div class="card-body">'+chart(d.daily)+'</div></div>';
    h+='<div class="card"><div class="tabs" id="tabs" role="tablist"></div><div id="panel"></div></div>';
    h+='<p class="foot">Days are in UTC. A player is one account: guests get one automatically the first time they play. '+
       'Locations are approximate, from the address a player last signed in from. Data-centre locations are marked as bots and hidden unless you choose to show them. '+
       'When &amp; Where, Linkezy and Lingoezy are not included. IP geolocation by <a href="https://db-ip.com">DB-IP</a>.</p>';
    $("body").innerHTML=h;
    $("tabs").onclick=function(e){var b=e.target.closest(".tab");if(!b)return;tab=b.dataset.tab;try{sessionStorage.setItem("bgw-admin-tab",tab)}catch(x){}renderTab()};
    if(!VIEWS[tab])tab="activity";
    renderTab();
  }

  /* ---------- data and sign-in ---------- */
  async function load(){
    $("aerr").textContent="";
    var r=await sb.rpc("admin_activity_overview",{p_days:parseInt($("range").value,10)});
    if(r.error){
      $("body").innerHTML="";
      $("aerr").textContent=(r.error.message==="not authorized")?"This account is not an admin. Ask the site owner to add it.":("Could not load: "+r.error.message);
      return;
    }
    $("stamp").textContent="Updated "+new Date(r.data.generated_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    render(r.data);
  }

  async function show(){
    var s=(await sb.auth.getSession()).data.session;
    var ok=s&&s.user&&!s.user.is_anonymous;
    $("login").hidden=!!ok; $("app").hidden=!ok;
    if(ok)load();
  }

  $("go").onclick=async function(){
    $("lerr").textContent="";
    var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    if(r.error)$("lerr").textContent=r.error.message; else show();
  };
  $("signup").onclick=async function(){
    $("lerr").textContent="";
    var r=await sb.auth.signUp({email:$("em").value.trim(),password:$("pw").value});
    if(r.error)$("lerr").textContent=r.error.message;
    else if(r.data.session)show();
    else $("lerr").textContent="Check your email to confirm the account, then sign in.";
  };
  $("pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click()});
  $("refresh").onclick=load; $("range").onchange=load;
  $("out").onclick=async function(){await sb.auth.signOut();show()};
  show();
})();
</script>
</body>
</html>
